# **VPS（120.26.179.211）上 w.stalkerai.cn 的那一份 nginx 片段**（2026-09-24 照实抄下来）
#
# 🔴 **它不在仓库里也不在“部署”里** —— 它是**那台机器的状态**：
#    改它要 `ssh root@120.26.179.211`，改完 `nginx -t` ⇒ `systemctl reload nginx`。
#    抄一份进仓库，是为了"**改了什么**"有据可查（原来它只活在 VPS 上，谁改的没人知道）。
#
# 链路：nginx(443) → 127.0.0.1:3084〔frp stcp visitor，只在本机〕
#       → frps(:7000) → 本机 frpc → 127.0.0.1:8020（`v2/services/core/src/serve.js`）
#
# ⚠️ **两处历史**（都在这里留下痕迹）：
#   ① `location ~ ^/api/(stream|asr)$` —— 原来只写 `= /api/stream`（精确匹配那一条）。
#      加 `/api/asr`（语音）时忘了这一跳的后果是：**本机直连一切正常、公网握手就断**
#      （浏览器只看到 `1006`），而页面上写的是"开不了麦克风"（页面在说假话）。
#      ⇒ 主人 2026-09-23 当场授权改这一行；备份 `w-stalkerai.conf.bak-20260923215845`。
#   ② WebSocket 那一段**不许用 http 级的 `map`** —— 会和这台机器上别人的定义撞车
#      （那台 VPS 还跑着别的站点）。⇒ 单独一段，只管这两条路径。
#
# ⚠️ **以后再加任何 WS 路径，都要回来改这一行**（漏了的表现就是"本机好好的、公网握手断"）。

server {
    listen 80;
    listen [::]:80;
    server_name w.stalkerai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name w.stalkerai.cn;

    ssl_certificate /etc/letsencrypt/live/w.stalkerai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w.stalkerai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # WebSocket：只有这两条路径需要 Upgrade（2026-09-23 加 /api/asr —— 语音那条）。
    location ~ ^/api/(stream|asr)$ {
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：读完/写超时都要放大，否则会被 nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
