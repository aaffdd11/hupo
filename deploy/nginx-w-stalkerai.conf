# w.stalkerai.cn -> 琥珀 v2 调度器，跑在局域网工作站 welkin-X399（192.168.1.107）上。
#
# Path: nginx(443) -> 127.0.0.1:3084 [frp stcp visitor, loopback only]
#       -> frps(:7000) -> frpc on welkin-X399 -> 127.0.0.1:8020
#          （单端口同时服务 Flutter web 静态产物与 /api，含 WebSocket）
# stcp 不占任何公网端口，除了 nginx 没有别的入口。
#
# ⚠️ 这一段是**新增**的，没有改动任何已有 conf（u / v / hupo / dsh …）。
server {
    listen 80;
    listen [::]:80;
    server_name w.stalkerai.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name w.stalkerai.cn;

    ssl_certificate /etc/letsencrypt/live/w.stalkerai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/w.stalkerai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # WebSocket：需要 Upgrade 的那几条路径（2026-09-23 加 /api/asr —— 语音那条；
    # 2026-09-24 加 /api/harness —— 「我自己那台」那条原始会话流，`docs/dev/81-HARNESS-ENTRY.md`）。
    # 🔴 **加一条新 WS 路径 = 往这个正则里加一个名字**：漏了 Upgrade 头就不转发，
    #    到 app 会变成普通 GET ⇒ 必然 401（客户端表现为"连不上"，但令牌其实是好的）。
    # ⚠️ 单独开一段，**不用 http 级的 map**——那会和别人已有的定义撞车。
    location ~ ^/api/(stream|asr|harness)$ {
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：读完/写超时都要放大，否则会被 nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
