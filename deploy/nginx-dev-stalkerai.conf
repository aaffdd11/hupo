# dsh19145526557.stalkerai.cn -> 琥珀「开发者模式」：某个用户盒子里那台 DSH 的界面。
#
# ⚠️ **这是线上那份的抄本**（`/etc/nginx/conf.d/dsh-19145526557.conf`）。
#    给下一个开发者用户开的时候：照这份复制一份、把**域名里的手机号**换掉、
#    签一张它自己的证书（`certbot certonly --nginx -d dsh<手机号>.stalkerai.cn`）。
#    契约与判据：`docs/dev/82-DEV-MODE.md`。
#
# Path: nginx(443) -> 127.0.0.1:3084 [frp stcp visitor，**复用 w. 那条，不新增隧道/端口**]
#       -> frps(:7000) -> 本机 frpc -> 127.0.0.1:8020（核心按 **Host** 分流到该租户的中继）
#
# ⚠️ 盒子那侧**不开端口**：容器里只听 127.0.0.1，靠我们自己的中继接进来。
# ⚠️ 那个界面全走普通 HTTP（`/api` 是 fetch 桥，不是 WebSocket）⇒ 普通反代即可。
server {
    listen 80;
    listen [::]:80;
    server_name dsh19145526557.stalkerai.cn;
    # ⚠️ 重定向写在 location 里：certbot 的 http-01 挑战路径要能优先命中
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsh19145526557.stalkerai.cn;

    ssl_certificate /etc/letsencrypt/live/dsh19145526557.stalkerai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh19145526557.stalkerai.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3084;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 界面是流式的：不许攒
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
