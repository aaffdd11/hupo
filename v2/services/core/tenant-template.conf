# 租户命名与编号模板 —— **唯一权威**（契约 `docs/dev/43-AUTO-PROVISION.md` §三 A2）
#
# ── 为什么要有这么一个文件 ──────────────────────────────────
# "自动开一台"要两边的**两套语言**推出**逐字相同**的名字：
#   · 服务侧（JS）要知道**租户名**，才能提前去听那条通道；
#   · 特权侧（root 的 shell）要知道**用户名/uid/home/卷**，才能真把人建出来。
# 两边各写一份常数 = **两处数字**，而这个项目里"两处数字一定会漂"。
# ⇒ 放这里一份，两边都读它。
#
# ── 格式 ────────────────────────────────────────────────────
#   `键=值`，`#` 开头是注释，空行忽略。**只认下面这三个键**，多一个都算错（防"悄悄加旋钮"）。
#
# ⚠️ 改这里的值 = 改"新租户长什么样"。**已经建出来的不受影响**
#    （名字已经写进 `/etc/passwd` 了）—— 所以改它之前先想清楚，
#    因为它会让"老的"和"新的"两套命名并存。

# 租户名的前缀。`u<N>` → `<前缀><N>`（例如 `u3` → `hupo-t3`）
name_prefix=hupo-t

# 租户 uid 的起点：`<uid_base> + N`（`name_prefix` 那套用）
uid_base=3000

# 🔴 **最多开多少台**（超过就是"满了"，见 §三 A4）。
#    这个数**按磁盘算**：每台一份镜像（约 385M）+ 一个卷 + 一份 subuid。
#    它是一道**硬上限**，不是"建议"—— 因为是它在兜"公开口能烧资源"那条代价。
max_tenants=8
