# 琥珀 —— **能力层**（批 4 · 契约 `docs/dev/31-LEDGER.md` v2 §7.1）
#
# 用法（`v2/services/core` 起 agent 进程时带，两条一起）：
#   dsh --profile sdk --patch <repo>/v2/services/core/hupo-persona.yml \
#                     --patch <repo>/v2/services/core/hupo-capabilities.yml
#   （两条都已经是 `config.js` 里的**默认值**；`dsh --patch` 官方支持重复，见 `dsh --help`。）
#
# ── 为什么是一层 patch，而不是去改 profile ────────────────────────
# 改 profile（`~/.dsh/profiles/*/cordis.patch.yml`）会让**每一次**改动都要主人
# 补一条 `sudo` 重建清单 —— 那几个文件在开机清单里是 `strict`。
# 而 `--patch` 是官方支持的"额外覆盖层，作用在 profile 层之后"，
# **碰都不碰那几个受保护文件**（`docs/dev/31-LEDGER.md` §三·补二）。
#
# ⚠️ 形状必须是 `- insert: [ … ]`。
#    写成 `- id: <一个新 id>` 会被当成"改一个**已存在**的条目"——
#    实测直接报 `patch: entry "…" not found`，而且**树里不会有它**（同上 §三·补二）。
#
# ⚠️ 值从**环境**来（`!!js`），**不写死路径**：
#    这台机器与生产机是两个 checkout，路径不一样。
#    三个变量由服务端 spawn 时设好（`agent-runtime.js` 的 `childEnv`）。
#    ⚠️ 这里**没有也不许有**任何秘密：MCP 那头拿到的是一个**域套接字路径**，
#       准入靠文件权限（0600），见契约 §7.2。

- insert:
    - id: mcp-ledger
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ledger
        transport: stdio
        command: !!js process.env.HUPO_NODE_BIN
        args:
          - !!js process.env.HUPO_LEDGER_SERVER
        env:
          HUPO_LEDGER_SOCKET: !!js process.env.HUPO_LEDGER_SOCKET
        # ⚠️ 起不来就**别悄悄少一个工具**：能力层缺了 = 记不了账，
        #    而那件事必须**当场看得见**（本仓库反复栽的那个形状就是"静默降级"）。
        #    常见的配置错误（文件不在、路径空）在服务端 `preflight` 里已经先拦一道。
        failOnStartupError: true
        # 本机域套接字，快得很；默认那 60 秒是给网络那头的服务器留的。
        toolCallTimeoutMs: 15000
    # ── 小程序那两条（乙-2 · 契约 `docs/dev/59-USER-APPS.md` §二）──────────
    # ⚠️ **写入永远只有一处**：这个进程**不写盘**，只把请求经域套接字递给服务端。
    # ⚠️ 这一批只挂**两件**（造 / 看）。发布、装上、授权那几件要等"发现/权限"两批 ——
    #    **现在挂上去就是让它去承诺一件做不到的事**（那正是这个仓库最忌的假话）。
    # ★ **画图那一支**（P1-27 后半 · 2026-09-24）：工具**面向**独立成一条
    #   （要给模型单独开关画图，去掉这一块就行，不用碰小程序那条）。
    #   ⚠️ 通道还是同一条域套接字（`HUPO_APPS_SOCKET`）——服务端只有**一个**动手的地方。
    - id: mcp-image
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: image
        transport: stdio
        command: !!js process.env.HUPO_NODE_BIN
        args:
          - !!js process.env.HUPO_IMAGE_SERVER
        env:
          HUPO_IMAGE_SOCKET: !!js process.env.HUPO_APPS_SOCKET
        # 起不来**不许静默降级**（同账本/小程序那两条的理由）
        failOnStartupError: true
        # 画图比聊天慢得多（那边自己也开着 120 秒的上限）
        toolCallTimeoutMs: 150000
    - id: mcp-apps
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: apps
        transport: stdio
        command: !!js process.env.HUPO_NODE_BIN
        args:
          - !!js process.env.HUPO_APPS_SERVER
        env:
          HUPO_APPS_SOCKET: !!js process.env.HUPO_APPS_SOCKET
        # 起不来**不许静默降级**（同账本那条的理由）
        failOnStartupError: true
        toolCallTimeoutMs: 15000
