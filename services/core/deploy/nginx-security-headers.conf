# Hupo 安全响应头（片段）。
#
# ⚠ 为什么是 include 到每个 location，而不是只写在 server 块里：
#   nginx 的 add_header **只在当前层级没有任何 add_header 时才继承上级**。
#   那些已经写了 Cache-Control 的 location（/index.html、/assets/ …）会把 server 级的
#   安全头整个吞掉 —— 于是出现"加了头但某些路径没有"的假象（红队实测过这个坑）。
#
# ⚠ HSTS 先用 300 秒观察几天再拉长：一旦发出去，浏览器会记住，
#   证书出问题时用户连"继续访问"都点不了。
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=300" always;
