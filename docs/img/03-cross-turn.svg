<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 3 · 跨轮与并发状态机：用户插话 / 并发提问 / 品类切换</text>
<rect x="20" y="50" width="900" height="300" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="72" fill="#8b949e" font-size="12" font-weight="700">A. 正常轮（处理层后到）</text>
<rect x="20" y="366" width="900" height="300" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="388" fill="#8b949e" font-size="12" font-weight="700">B. 用户在原任务未完成时插话（缺口 5 / 6）</text>
<rect x="20" y="682" width="900" height="230" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="704" fill="#8b949e" font-size="12" font-weight="700">C. 品类切换与恢复（缺口 10）</text>
<text x="50" y="109" fill="#e6edf3" font-size="13" text-anchor="start">用户 Q1 ──► 接收层开口 ──► 处理层(Q1) 深研中…</text>
<text x="50" y="126" fill="#e6edf3" font-size="13" text-anchor="start">                    │</text>
<text x="50" y="143" fill="#e6edf3" font-size="13" text-anchor="start">                    ├─ 用户仍在打字/等待 → 控制器判定&quot;无缺口&quot;，不动作</text>
<text x="50" y="160" fill="#e6edf3" font-size="13" text-anchor="start">                    │</text>
<text x="50" y="177" fill="#e6edf3" font-size="13" text-anchor="start">                    └─ 处理层就绪 ──► 接管判决 ──► 反馈层说结论 ──► 落账</text>
<rect x="60" y="250" width="830" height="33" rx="6" fill="#22201a" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="70" y="271" fill="#3fb950" font-size="12">用户打字的时间 = 天然的、用户无感的操作窗口（用于上下文维护与记忆注入）</text>
<text x="50" y="425" fill="#e6edf3" font-size="13" text-anchor="start">用户 Q1 ──► 处理层(Q1) 深研中… ──► 用户又发 Q2（此时 Q1 未完成）</text>
<text x="50" y="442" fill="#e6edf3" font-size="13" text-anchor="start">                                        │</text>
<text x="50" y="459" fill="#e6edf3" font-size="13" text-anchor="start">      ┌─────────────────────────────────┴────────────────────────────────┐</text>
<text x="50" y="476" fill="#e6edf3" font-size="13" text-anchor="start">      ▼                                                                  ▼</text>
<text x="50" y="493" fill="#e6edf3" font-size="13" text-anchor="start">  路径 B1：接收层立即应 Q2                        路径 B2：Q1 结论到达</text>
<text x="50" y="510" fill="#e6edf3" font-size="13" text-anchor="start">  · 任务队列登记 Q2（归属当前轮）                  · 不抢占 Q2 的响应</text>
<text x="50" y="527" fill="#e6edf3" font-size="13" text-anchor="start">  · 处理层池起第二个会话跑 Q2（上限 2）             · Q1 结论入队，待 Q2 说完再发</text>
<text x="50" y="544" fill="#e6edf3" font-size="13" text-anchor="start">  · Q1 结论若已就绪 → 排队，不打断 Q2              · 两条结论合并成一条说（不连发）</text>
<rect x="920" y="400" width="420" height="67" rx="6" fill="#22201a" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="930" y="421" fill="#d29922" font-size="12">缺口 5：未完成任务队列 + 轮次归属</text>
<text x="930" y="436" fill="#d29922" font-size="12">缺口 6：用户打断 agent 与控制器</text>
<text x="930" y="451" fill="#d29922" font-size="12">打断 agent 是两套语义，需分别定义</text>
<text x="50" y="741" fill="#e6edf3" font-size="13" text-anchor="start">Q1 技术类 ──► 用户切到写作类 ──► 用户又切回技术类</text>
<text x="50" y="758" fill="#e6edf3" font-size="13" text-anchor="start">   │                                    │</text>
<text x="50" y="775" fill="#e6edf3" font-size="13" text-anchor="start">   技术窗口(热)                          恢复方式 = 把技术类摘要【尾部追加】</text>
<text x="50" y="792" fill="#e6edf3" font-size="13" text-anchor="start">   写作窗口(冷→热，干净窗口)              ✓ 前缀未动 → 缓存保留</text>
<text x="50" y="809" fill="#e6edf3" font-size="13" text-anchor="start">                                          ✓ 经验已 committed → 接收层第一句就能说&quot;这个我熟&quot;</text>
<rect x="60" y="840" width="830" height="33" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="70" y="861" fill="#f85149" font-size="12">缺口 10 未定义项：上下文恢复协议（用什么载体、追加到哪、旧窗口怎么回收）</text>
<rect x="940" y="50" width="420" height="862" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="954" y="72" fill="#8b949e" font-size="12" font-weight="700">链路完整性审计：8 个缺口</text>
<text x="960" y="104.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">致命（3 个）</text>
<text x="960" y="128" fill="#f85149" font-size="12" text-anchor="start">1 无角色间共享事实源：三角色对同一轮认知互不相通，用户说&quot;那个东西</text>
<text x="960" y="144" fill="#f85149" font-size="12" text-anchor="start">&quot;三个角色都在猜</text>
<text x="960" y="160" fill="#f85149" font-size="12" text-anchor="start">2 结论无法直接说出口：缺&quot;衔接改写&quot;，结论是给控制器的结构化数据，</text>
<text x="960" y="176" fill="#f85149" font-size="12" text-anchor="start">不是给人听的话</text>
<text x="960" y="192" fill="#f85149" font-size="12" text-anchor="start">3 系统注入污染会话历史：inject 的记忆简报会被记进日志，下一</text>
<text x="960" y="208" fill="#f85149" font-size="12" text-anchor="start">轮读到自己对简报的回应</text>
<text x="960" y="284.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">重要（3 个）</text>
<text x="960" y="308" fill="#d29922" font-size="12" text-anchor="start">4 两角色历史混在一条会话里，需要角色标注 + 各自读不同切片</text>
<text x="960" y="324" fill="#d29922" font-size="12" text-anchor="start">5 用户在原任务未完成时插话：未完成任务队列 + 归属轮次未定义</text>
<text x="960" y="340" fill="#d29922" font-size="12" text-anchor="start">6 用户打断 agent：与控制器打断是两套语义，未定义</text>
<text x="960" y="440.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">中等（2 个）</text>
<text x="960" y="464" fill="#8b949e" font-size="12" text-anchor="start">7 轮际状态载体：上轮说了什么/接管点/一致性，跨轮丢失</text>
<text x="960" y="480" fill="#8b949e" font-size="12" text-anchor="start">8 发言出口采集：账本只记结论，没记&quot;实际对用户说出的话&quot;，纠正的证</text>
<text x="960" y="496" fill="#8b949e" font-size="12" text-anchor="start">据链断在这里</text>
<text x="960" y="576.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">场景覆盖度（12 个必然发生的场景）</text>
<text x="960" y="600" fill="#8b949e" font-size="12" text-anchor="start">已定义 4 个（正常轮×2、超时、取消）</text>
<text x="960" y="616" fill="#8b949e" font-size="12" text-anchor="start">只提未细化 3 个（处理层先到、续话耗尽、连续同类）</text>
<text x="960" y="632" fill="#8b949e" font-size="12" text-anchor="start">完全未定义 5 个（插话、并发提问、反馈层被打断、品类切换、多结论合</text>
<text x="960" y="648" fill="#8b949e" font-size="12" text-anchor="start">并）</text>
<rect x="960" y="700" width="380" height="118" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="970" y="721" fill="#f85149" font-size="12">规律：现有设计是&quot;单向流水线&quot;，</text>
<text x="970" y="736" fill="#f85149" font-size="12">而真实对话是&quot;有状态的并发系统&quot;。</text>
<text x="970" y="751" fill="#f85149" font-size="12">缺的 8 个里 6 个出于同一原因。</text>
<text x="970" y="766" fill="#f85149" font-size="12"></text>
<text x="970" y="781" fill="#f85149" font-size="12">根 = 缺口 1（共享事实源 + 角色视图），</text>
<text x="970" y="796" fill="#f85149" font-size="12">其余 5 个都挂在它上面。</text>
</svg>