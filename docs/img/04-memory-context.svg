<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="880" viewBox="0 0 1380 880" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 4 · 记忆层级、上下文预算与注入位置（实测依据）</text>
<rect x="20" y="50" width="620" height="380" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="72" fill="#8b949e" font-size="12" font-weight="700">记忆层级（每用户一份，控制器独占写权）</text>
<rect x="50" y="92" width="560" height="92" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>
<text x="330" y="113" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">热窗口（每品类独立）</text>
<text x="62" y="136" fill="#e6edf3" font-size="13">最近 8–12 轮原文 · 每品类 20–50K</text>
<text x="62" y="153" fill="#e6edf3" font-size="13">生命周期：品类活跃时存在</text>
<rect x="50" y="200" width="560" height="92" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>
<text x="330" y="221" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">温摘要（每品类一份）</text>
<text x="62" y="244" fill="#e6edf3" font-size="13">溢出部分压成摘要 · 5–10K</text>
<text x="62" y="261" fill="#e6edf3" font-size="13">生命周期：会长大，达上限再压</text>
<rect x="50" y="308" width="560" height="92" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>
<text x="330" y="329" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">冷经验（进记忆库）</text>
<text x="62" y="352" fill="#e6edf3" font-size="13">问题模式 → 解法 · 有界</text>
<text x="62" y="369" fill="#e6edf3" font-size="13">生命周期：永久，带置信度衰减</text>
<path d="M 330 184 L 330 200" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="171" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="330" y="186" fill="#8b949e" font-size="12" text-anchor="middle">溢出压缩</text>
<path d="M 330 292 L 330 308" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="306" y="279" width="48" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="330" y="294" fill="#8b949e" font-size="12" text-anchor="middle">再压缩</text>
<rect x="50" y="402" width="560" height="33" rx="6" fill="#22201a" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60" y="423" fill="#3fb950" font-size="12">上下文按品类隔离 → 成本不随总轮数增长，只随当前品类轮数增长</text>
<rect x="660" y="50" width="700" height="380" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="674" y="72" fill="#8b949e" font-size="12" font-weight="700">单次请求的组装顺序（顺序固定，不可重排）</text>
<rect x="690" y="92" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="112" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">system 前缀</text>
<text x="702" y="134" fill="#e6edf3" font-size="12">persona + 角色指令 + 工具说明 + 品类方法论（全静态）</text>
<rect x="690" y="174" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="194" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">历史消息</text>
<text x="702" y="216" fill="#e6edf3" font-size="12">只追加，永不改写（工具结果也放这里）</text>
<rect x="690" y="256" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="276" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">尾部注入</text>
<text x="702" y="298" fill="#e6edf3" font-size="12">记忆简报 / 上下文摘要 / 本轮要点（每轮都变）</text>
<rect x="690" y="338" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="358" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">本轮用户消息</text>
<text x="702" y="380" fill="#e6edf3" font-size="12">用户原话（必须原文进，不能只给摘要）</text>
<path d="M 1010 160 L 1010 174" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1010 242 L 1010 256" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1010 324 L 1010 338" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="450" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="472" fill="#8b949e" font-size="12" font-weight="700">实测依据：记忆植入位置决定缓存代价（长历史 4128 tokens）</text>
<text x="60" y="510" fill="#8b949e" font-size="12" text-anchor="start">植入位置                                   缓存命中        未命中量              成本</text>
<rect x="50" y="504" width="1280" height="30" rx="5" fill="#1a1f26"/>
<text x="64" y="524" fill="#f85149" font-size="12.5">插到最前（system 之后）</text>
<text x="530" y="524" fill="#e6edf3" font-size="12.5">命中 18.5%</text>
<text x="720" y="524" fill="#e6edf3" font-size="12.5">未命中 3383 tokens</text>
<text x="1000" y="524" fill="#f85149" font-size="12.5">$0.001015</text>
<rect x="50" y="538" width="1280" height="30" rx="5" fill="#1a1f26"/>
<text x="64" y="558" fill="#3fb950" font-size="12.5">追加到最尾</text>
<text x="530" y="558" fill="#e6edf3" font-size="12.5">命中 95.6%</text>
<text x="720" y="558" fill="#e6edf3" font-size="12.5">未命中 184 tokens</text>
<text x="1000" y="558" fill="#3fb950" font-size="12.5">$0.000055</text>
<rect x="50" y="572" width="1280" height="30" rx="5" fill="#1a1f26"/>
<text x="64" y="592" fill="#3fb950" font-size="12.5">紧接最后一条 assistant（推荐）</text>
<text x="530" y="592" fill="#e6edf3" font-size="12.5">命中 94.4%</text>
<text x="720" y="592" fill="#e6edf3" font-size="12.5">未命中 228 tokens</text>
<text x="1000" y="592" fill="#3fb950" font-size="12.5">$0.000068</text>
<text x="60" y="656" fill="#f85149" font-size="12" text-anchor="start">结论：改前缀中部 = 未命中暴涨 18 倍。任何记忆/摘要只能尾部追加，绝不改写前缀（唯一例外：整块重建）</text>
<rect x="20" y="656" width="1340" height="196" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="678" fill="#8b949e" font-size="12" font-weight="700">双状态分路拦截：用户输入 vs 系统注入（按 source 标记判定，不靠内容猜）</text>
<rect x="60" y="700" width="600" height="130" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="360" y="721" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">状态一：用户输入触发的回应</text>
<text x="72" y="744" fill="#e6edf3" font-size="13">· 入口标记 source = 真实用户提示</text>
<text x="72" y="761" fill="#e6edf3" font-size="13">· 出口：放行 → 用户可见</text>
<text x="72" y="778" fill="#e6edf3" font-size="13">· 需要回复预算、需要进度估算</text>
<rect x="720" y="700" width="600" height="130" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>
<text x="1020" y="721" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">状态二：系统注入触发的回应（记忆/上下文/简报）</text>
<text x="732" y="744" fill="#e6edf3" font-size="13">· 入口标记 source = inject 合成上下文</text>
<text x="732" y="761" fill="#e6edf3" font-size="13">· 出口：拦截，永不外发</text>
<text x="732" y="778" fill="#e6edf3" font-size="13">· 不需要回复预算，fire-and-forget，纯静默吸收</text>
</svg>