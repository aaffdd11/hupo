<rect x="520" y="710" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="550" y="725" fill="#8b949e" font-size="12" text-anchor="middle">② 捕获</text>
<path d="M 470 300 L 330 384" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="370" y="321" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="400" y="336" fill="#8b949e" font-size="12" text-anchor="middle">③ 分发</text>
<path d="M 910 300 L 945 384" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="897.5" y="321" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="927.5" y="336" fill="#8b949e" font-size="12" text-anchor="middle">③ 分发</text>
<path d="M 340 480 L 340 642" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="310" y="540" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
