<text x="690" y="858" fill="#8b949e" font-size="12" text-anchor="middle">读写</text>
<path d="M 470 186 Q 210 507 470 828" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
