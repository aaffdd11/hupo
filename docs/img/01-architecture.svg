<text x="330" y="373" fill="#8b949e" font-size="12" text-anchor="middle">⑤ 简报 / 续话 / 打断</text>
<path d="M 1040 186 Q 1190 414 1040 642" fill="none" stroke="#7d8590" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
