<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="900" viewBox="0 0 1380 900" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 2 · 单轮消息流：从用户开口到用户看到一条消息</text>
<rect x="40" y="56" width="220" height="44" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="150" y="77" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">用户</text>
<rect x="300" y="56" width="220" height="44" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="410" y="77" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">控制器</text>
<rect x="560" y="56" width="220" height="44" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="670" y="77" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">接收层</text>
<rect x="820" y="56" width="220" height="44" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="930" y="77" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">处理层</text>
<rect x="1080" y="56" width="220" height="44" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1190" y="77" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">反馈层</text>
<path d="M 150 132 L 410 132" fill="none" stroke="#4a90d9" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="238" y="111" width="84" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="280" y="126" fill="#8b949e" font-size="12" text-anchor="middle">① 用户输入</text>
<circle cx="410" cy="178" r="5" fill="#3fb950" />
<path d="M 410 210 L 670 210" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="456" y="189" width="168" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="540" y="204" fill="#8b949e" font-size="12" text-anchor="middle">② 发言简报 + 记忆简报</text>
<path d="M 410 210 L 930 210" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="592" y="189" width="156" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="670" y="204" fill="#8b949e" font-size="12" text-anchor="middle">③ 任务 + 上下文快照</text>
<circle cx="670" cy="258" r="5" fill="#d29922" />
<path d="M 670 300 L 410 300" fill="none" stroke="#d29922" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450" y="279" width="180" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="540" y="294" fill="#8b949e" font-size="12" text-anchor="middle">④ 文本流（逐 chunk）</text>
<path d="M 930 300 L 410 300" fill="none" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="628" y="279" width="84" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="670" y="294" fill="#8b949e" font-size="12" text-anchor="middle">⑤ 结论就绪</text>
<circle cx="410" cy="352" r="5" fill="#3fb950" />
<path d="M 410 400 L 670 400" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="462" y="379" width="156" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="540" y="394" fill="#8b949e" font-size="12" text-anchor="middle">⑥ 续话通知 / 软打断</text>
<circle cx="670" cy="448" r="5" fill="#d29922" />
<path d="M 410 490 L 1190 490" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="590" y="469" width="420" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="800" y="484" fill="#8b949e" font-size="12" text-anchor="middle">⑦ 接管指令（承载包：已输出全文 + 接管点 + 一致性 + 结论）</text>
<path d="M 1190 540 L 410 540" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="752" y="519" width="96" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="800" y="534" fill="#8b949e" font-size="12" text-anchor="middle">⑧ 收尾文本流</text>
<path d="M 410 600 L 150 600" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190" y="579" width="180" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="280" y="594" fill="#8b949e" font-size="12" text-anchor="middle">⑨ 放行（用户看到一条消息）</text>
<circle cx="410" cy="652" r="5" fill="#f85149" />
<circle cx="410" cy="700" r="5" fill="#f85149" />
<text x="424" y="188" fill="#8b949e" font-size="12" text-anchor="start">分类（常驻分类器，一次性调用）</text>
<text x="424" y="204" fill="#8b949e" font-size="12" text-anchor="start">组装两个视图：接收层/处理层各一份</text>
<text x="424" y="220" fill="#8b949e" font-size="12" text-anchor="start">起优先级队列</text>
<text x="684" y="268" fill="#8b949e" font-size="12" text-anchor="start">接收层开口（首字 0.8–1.5s）</text>
<text x="684" y="284" fill="#8b949e" font-size="12" text-anchor="start">说的是&quot;这个我熟…&quot;而不是&quot;我听到了&quot;</text>
<text x="424" y="362" fill="#8b949e" font-size="12" text-anchor="start">接管判决：ETA × 时效性 × 打断禁区</text>
<text x="424" y="378" fill="#8b949e" font-size="12" text-anchor="start">实测常见结果 = 软打断</text>
<text x="684" y="458" fill="#8b949e" font-size="12" text-anchor="start">说完当前句即停（无半截话）</text>
<text x="424" y="662" fill="#8b949e" font-size="12" text-anchor="start">写提案（pending）→ 观察用户反应</text>
<text x="424" y="678" fill="#8b949e" font-size="12" text-anchor="start">未纠正 → committed / 纠正 → retracted</text>
<rect x="900" y="720" width="440" height="101" rx="6" fill="#22201a" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="910" y="741" fill="#d29922" font-size="12">关键实测：处理层常比接收层首字更快</text>
<text x="910" y="756" fill="#d29922" font-size="12">（900ms vs 1200ms）→ 多数轮次是&quot;接收层说一句，</text>
<text x="910" y="771" fill="#d29922" font-size="12">反馈层紧接着接管&quot;，而非&quot;接收层说很久被救场&quot;</text>
<text x="910" y="786" fill="#d29922" font-size="12">推论：处理层先到时，接收层只说简短承接语，</text>
<text x="910" y="801" fill="#d29922" font-size="12">发言预算留给反馈层（否则两次发言说一件事）</text>
<path d="M 1250 132 L 1250 600" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1262" y="315" fill="#8b949e" font-size="11" text-anchor="start">控</text>
<text x="1262" y="330" fill="#8b949e" font-size="11" text-anchor="start">制</text>
<text x="1262" y="345" fill="#8b949e" font-size="11" text-anchor="start">器</text>
<text x="1262" y="360" fill="#8b949e" font-size="11" text-anchor="start">拦</text>
<text x="1262" y="375" fill="#8b949e" font-size="11" text-anchor="start">截</text>
<text x="1262" y="390" fill="#8b949e" font-size="11" text-anchor="start">点</text>
</svg>