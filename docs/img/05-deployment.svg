<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="980" viewBox="0 0 1380 980" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 5 · 客户端 + 云端部署：Flutter APP ⇄ 网关 ⇄ DSH 进程池</text>
<rect x="20" y="50" width="1340" height="210" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="72" fill="#8b949e" font-size="12" font-weight="700">一、客户端（Flutter，iOS + Android）：只负责接收与反馈，不含任何 agent 逻辑</text>
<rect x="60" y="92" width="400" height="150" rx="8" fill="#1f2d3d" stroke="#4a90d9" stroke-width="1.5"/>
<text x="260" y="113" fill="#4a90d9" font-size="14" font-weight="700" text-anchor="middle">Flutter App（Dart）</text>
<text x="72" y="136" fill="#e6edf3" font-size="13">· 聊天界面：输入框 / 消息流 / 流式打字</text>
<text x="72" y="153" fill="#e6edf3" font-size="13">· 本地持久化会话 ID 映射（三段 ID，见下）</text>
<text x="72" y="170" fill="#e6edf3" font-size="13">· WebSocket 长连接 + SSE 回退 + 断线重连</text>
<text x="72" y="187" fill="#e6edf3" font-size="13">· 消息 ID 去重与乱序重排</text>
<text x="72" y="204" fill="#e6edf3" font-size="13">· 安全存储：令牌放 Keychain / Keystore</text>
<rect x="490" y="92" width="380" height="150" rx="8" fill="#1f2d3d" stroke="#4a90d9" stroke-width="1.5"/>
<text x="680" y="113" fill="#4a90d9" font-size="14" font-weight="700" text-anchor="middle">平台差异（必须分别处理）</text>
<text x="502" y="136" fill="#e6edf3" font-size="13">· iOS：后台限制严，切后台即断连 → 服务器继续跑</text>
<text x="502" y="153" fill="#e6edf3" font-size="13">· iOS：APNs 推送；Android：FCM</text>
<text x="502" y="170" fill="#e6edf3" font-size="13">· 两者都需要&quot;回到前台拉取错过的消息&quot;</text>
<text x="502" y="187" fill="#e6edf3" font-size="13">· 应用商店审核：需账号删除入口（若有登录）</text>
<text x="502" y="204" fill="#e6edf3" font-size="13">· 弱网：地铁/电梯场景必须能续传</text>
<rect x="900" y="92" width="420" height="150" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1110" y="113" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">客户端只管两件事</text>
<text x="912" y="136" fill="#e6edf3" font-size="13">① 把用户输入送上去（带会话 ID）</text>
<text x="912" y="153" fill="#e6edf3" font-size="13">② 把服务端推来的内容显示出来</text>
<text x="912" y="170" fill="#e6edf3" font-size="13"></text>
<text x="912" y="187" fill="#e6edf3" font-size="13">不做：分类、记忆、进度估算、接管判决</text>
<text x="912" y="204" fill="#e6edf3" font-size="13">—— 全部在云端，客户端保持&quot;笨&quot;</text>
<rect x="20" y="274" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="296" fill="#8b949e" font-size="12" font-weight="700">二、网关层（自建，公网唯一入口）：DSH 原生没有多用户能力，这一层不可省</text>
<rect x="60" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="158" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">鉴权 / 令牌</text>
<text x="72" y="356" fill="#e6edf3" font-size="11">登录、设备令牌、</text>
<text x="72" y="371" fill="#e6edf3" font-size="11">令牌轮换与吊销</text>
<rect x="272" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="370" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">会话 ID 三段映射</text>
<text x="284" y="356" fill="#e6edf3" font-size="11">客户端 convId →</text>
<text x="284" y="371" fill="#e6edf3" font-size="11">DSH sessionId → 角色实例</text>
<rect x="484" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="582" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">连接管理</text>
<text x="496" y="356" fill="#e6edf3" font-size="11">WebSocket 长连接池、</text>
<text x="496" y="371" fill="#e6edf3" font-size="11">心跳、断连恢复、补发</text>
<rect x="696" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="794" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">用户路由</text>
<text x="708" y="356" fill="#e6edf3" font-size="11">userId → 该用户的</text>
<text x="708" y="371" fill="#e6edf3" font-size="11">DSH 进程 socket</text>
<rect x="908" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1006" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">限额与熔断</text>
<text x="920" y="356" fill="#e6edf3" font-size="11">每用户 token 配额、</text>
<text x="920" y="371" fill="#e6edf3" font-size="11">429 退避、成本上限</text>
<rect x="1120" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1218" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">可观测性</text>
<text x="1132" y="356" fill="#e6edf3" font-size="11">轮级 trace（含</text>
<text x="1132" y="371" fill="#e6edf3" font-size="11">缓存命中率、接管路径）</text>
<rect x="20" y="478" width="1340" height="268" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="500" fill="#8b949e" font-size="12" font-weight="700">三、云端 DSH Harness（所有 agent 都在这里）：按用户隔离的进程池</text>
<rect x="60" y="520" width="260" height="100" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="190" y="541" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">DSH 进程（用户 A）</text>
<text x="72" y="564" fill="#e6edf3" font-size="13">DSH_HOME=data/u_A</text>
<text x="72" y="581" fill="#e6edf3" font-size="13">独立凭证、独立存储</text>
<rect x="60" y="632" width="260" height="100" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="190" y="653" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">DSH 进程（用户 B）</text>
<text x="72" y="676" fill="#e6edf3" font-size="13">DSH_HOME=data/u_B</text>
<text x="72" y="693" fill="#e6edf3" font-size="13">进程级天然隔离</text>
<rect x="360" y="520" width="620" height="212" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="670" y="540" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">单个 DSH 进程内部的角色布局</text>
<text x="372" y="562" fill="#e6edf3" font-size="12">接收层 agent（快、在场）   处理层 agent × N（按类别，不扇出）   反馈层 agent（承接）</text>
<text x="372" y="578" fill="#e6edf3" font-size="12">常驻分类器（只判定）        控制器（APP 层逻辑，跑在本进程内）</text>
<text x="372" y="594" fill="#e6edf3" font-size="12">记忆库：档案 / 品类树 / 经验包 / 指标 / 证据链  ← 每用户一份</text>
<text x="372" y="610" fill="#e6edf3" font-size="12"></text>
<text x="372" y="626" fill="#e6edf3" font-size="12">进程内已有能力（已核实存在）：</text>
<text x="372" y="642" fill="#e6edf3" font-size="12">· 会话持久化 + 按 sessionId 恢复（resumeSessionId）</text>
<text x="372" y="658" fill="#e6edf3" font-size="12">· session/event 事件流、assistant/chunk（token 级）</text>
<text x="372" y="674" fill="#e6edf3" font-size="12">· agent.cancel / steer / inject / followup</text>
<text x="372" y="690" fill="#e6edf3" font-size="12">· WebSocket 下行 + SSE 流式（客户端连接的现成载体）</text>
<text x="372" y="706" fill="#e6edf3" font-size="12">· SQLite 会话查询（会话列表的来源）</text>
<rect x="1000" y="520" width="340" height="135" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1010" y="541" fill="#f85149" font-size="12">⚠ 已核实：DSH 没有多租户身份</text>
<text x="1010" y="556" fill="#f85149" font-size="12">· 无登录/令牌体系</text>
<text x="1010" y="571" fill="#f85149" font-size="12">· anonymous-user-id 只用于遥测</text>
<text x="1010" y="586" fill="#f85149" font-size="12">· authorization 是&quot;工具授权&quot;，不是用户鉴权</text>
<text x="1010" y="601" fill="#f85149" font-size="12">· 凭证是每 DSH_HOME 一份（本地）</text>
<text x="1010" y="616" fill="#f85149" font-size="12">· webserver 绑定仅 loopback / 全接口</text>
<text x="1010" y="631" fill="#f85149" font-size="12">→ 对外暴露必须自建网关 + 反向代理</text>
<rect x="20" y="760" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="782" fill="#8b949e" font-size="12" font-weight="700">四、数据层</text>
<rect x="60" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="210" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">会话正文</text>
<text x="72" y="842" fill="#e6edf3" font-size="12">DSH 的 session.jsonl + SQ</text>
<text x="72" y="858" fill="#e6edf3" font-size="12">Lite 索引</text>
<rect x="382" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="532" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">记忆库</text>
<text x="394" y="842" fill="#e6edf3" font-size="12">每用户一份：档案/品类树/经验/指标</text>
<rect x="704" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="854" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">凭证</text>
<text x="716" y="842" fill="#e6edf3" font-size="12">云端保管，绝不下发到客户端</text>
<rect x="1026" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="1176" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">配额与账单</text>
<text x="1038" y="842" fill="#e6edf3" font-size="12">每用户 token 计量、成本上限</text>
<path d="M 690 242 L 690 316" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="630" y="258" width="120" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="690" y="273" fill="#8b949e" font-size="12" text-anchor="middle">③ 客户端只认网关</text>
<path d="M 690 444 L 690 520" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="564" y="461" width="252" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="690" y="476" fill="#8b949e" font-size="12" text-anchor="middle">④ 网关按 userId 转发到对应进程</text>
</svg>