<path d="M 930 300 L 410 300" fill="none" stroke="#a371f7" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="628" y="279" width="84" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="670" y="294" fill="#8b949e" font-size="12" text-anchor="middle">⑤ 结论就绪</text>
<circle cx="410" cy="352" r="5" fill="#3fb950" />
<path d="M 410 400 L 670 400" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="462" y="379" width="156" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="540" y="394" fill="#8b949e" font-size="12" text-anchor="middle">⑥ 续话通知 / 软打断</text>
<circle cx="670" cy="448" r="5" fill="#d29922" />
<path d="M 410 490 L 1190 490" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="590" y="469" width="420" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="800" y="484" fill="#8b949e" font-size="12" text-anchor="middle">⑦ 接管指令（承载包：已输出全文 + 接管点 + 一致性 + 结论）</text>
<path d="M 1190 540 L 410 540" fill="none" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="752" y="519" width="96" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="800" y="534" fill="#8b949e" font-size="12" text-anchor="middle">⑧ 收尾文本流</text>
<path d="M 410 600 L 150 600" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190" y="579" width="180" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="280" y="594" fill="#8b949e" font-size="12" text-anchor="middle">⑨ 放行（用户看到一条消息）</text>
<circle cx="410" cy="652" r="5" fill="#f85149" />
<circle cx="410" cy="700" r="5" fill="#f85149" />
<text x="424" y="188" fill="#8b949e" font-size="12" text-anchor="start">分类（常驻分类器，一次性调用）</text>
<text x="424" y="204" fill="#8b949e" font-size="12" text-anchor="start">组装两个视图：接收层/处理层各一份</text>
<text x="424" y="220" fill="#8b949e" font-size="12" text-anchor="start">起优先级队列</text>
<text x="684" y="268" fill="#8b949e" font-size="12" text-anchor="start">接收层开口（首字 0.8–1.5s）</text>
<text x="684" y="284" fill="#8b949e" font-size="12" text-anchor="start">说的是&quot;这个我熟…&quot;而不是&quot;我听到了&quot;</text>
<text x="424" y="362" fill="#8b949e" font-size="12" text-anchor="start">接管判决：ETA × 时效性 × 打断禁区</text>
<text x="424" y="378" fill="#8b949e" font-size="12" text-anchor="start">实测常见结果 = 软打断</text>
<text x="684" y="458" fill="#8b949e" font-size="12" text-anchor="start">说完当前句即停（无半截话）</text>
<text x="424" y="662" fill="#8b949e" font-size="12" text-anchor="start">写提案（pending）→ 观察用户反应</text>
<text x="424" y="678" fill="#8b949e" font-size="12" text-anchor="start">未纠正 → committed / 纠正 → retracted</text>
<rect x="900" y="720" width="440" height="101" rx="6" fill="#22201a" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="910" y="741" fill="#d29922" font-size="12">关键实测：处理层常比接收层首字更快</text>
<text x="910" y="756" fill="#d29922" font-size="12">（900ms vs 1200ms）→ 多数轮次是&quot;接收层说一句，</text>
<text x="910" y="771" fill="#d29922" font-size="12">反馈层紧接着接管&quot;，而非&quot;接收层说很久被救场&quot;</text>
<text x="910" y="786" fill="#d29922" font-size="12">推论：处理层先到时，接收层只说简短承接语，</text>
<text x="910" y="801" fill="#d29922" font-size="12">发言预算留给反馈层（否则两次发言说一件事）</text>
<path d="M 1250 132 L 1250 600" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="1262" y="315" fill="#8b949e" font-size="11" text-anchor="start">控</text>
<text x="1262" y="330" fill="#8b949e" font-size="11" text-anchor="start">制</text>
<text x="1262" y="345" fill="#8b949e" font-size="11" text-anchor="start">器</text>
<text x="1262" y="360" fill="#8b949e" font-size="11" text-anchor="start">拦</text>
<text x="1262" y="375" fill="#8b949e" font-size="11" text-anchor="start">截</text>
<text x="1262" y="390" fill="#8b949e" font-size="11" text-anchor="start">点</text>
</svg></div></section>
<section id="03-cross-turn"><h2>03-cross-turn</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 3 · 跨轮与并发状态机：用户插话 / 并发提问 / 品类切换</text>
<rect x="20" y="50" width="900" height="300" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="72" fill="#8b949e" font-size="12" font-weight="700">A. 正常轮（处理层后到）</text>
<rect x="20" y="366" width="900" height="300" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="388" fill="#8b949e" font-size="12" font-weight="700">B. 用户在原任务未完成时插话（缺口 5 / 6）</text>
<rect x="20" y="682" width="900" height="230" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="704" fill="#8b949e" font-size="12" font-weight="700">C. 品类切换与恢复（缺口 10）</text>
<text x="50" y="109" fill="#e6edf3" font-size="13" text-anchor="start">用户 Q1 ──► 接收层开口 ──► 处理层(Q1) 深研中…</text>
<text x="50" y="126" fill="#e6edf3" font-size="13" text-anchor="start">                    │</text>
<text x="50" y="143" fill="#e6edf3" font-size="13" text-anchor="start">                    ├─ 用户仍在打字/等待 → 控制器判定&quot;无缺口&quot;，不动作</text>
<text x="50" y="160" fill="#e6edf3" font-size="13" text-anchor="start">                    │</text>
<text x="50" y="177" fill="#e6edf3" font-size="13" text-anchor="start">                    └─ 处理层就绪 ──► 接管判决 ──► 反馈层说结论 ──► 落账</text>
<rect x="60" y="250" width="830" height="33" rx="6" fill="#22201a" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="70" y="271" fill="#3fb950" font-size="12">用户打字的时间 = 天然的、用户无感的操作窗口（用于上下文维护与记忆注入）</text>
<text x="50" y="425" fill="#e6edf3" font-size="13" text-anchor="start">用户 Q1 ──► 处理层(Q1) 深研中… ──► 用户又发 Q2（此时 Q1 未完成）</text>
<text x="50" y="442" fill="#e6edf3" font-size="13" text-anchor="start">                                        │</text>
<text x="50" y="459" fill="#e6edf3" font-size="13" text-anchor="start">      ┌─────────────────────────────────┴────────────────────────────────┐</text>
<text x="50" y="476" fill="#e6edf3" font-size="13" text-anchor="start">      ▼                                                                  ▼</text>
<text x="50" y="493" fill="#e6edf3" font-size="13" text-anchor="start">  路径 B1：接收层立即应 Q2                        路径 B2：Q1 结论到达</text>
<text x="50" y="510" fill="#e6edf3" font-size="13" text-anchor="start">  · 任务队列登记 Q2（归属当前轮）                  · 不抢占 Q2 的响应</text>
<text x="50" y="527" fill="#e6edf3" font-size="13" text-anchor="start">  · 处理层池起第二个会话跑 Q2（上限 2）             · Q1 结论入队，待 Q2 说完再发</text>
<text x="50" y="544" fill="#e6edf3" font-size="13" text-anchor="start">  · Q1 结论若已就绪 → 排队，不打断 Q2              · 两条结论合并成一条说（不连发）</text>
<rect x="920" y="400" width="420" height="67" rx="6" fill="#22201a" stroke="#d29922" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="930" y="421" fill="#d29922" font-size="12">缺口 5：未完成任务队列 + 轮次归属</text>
<text x="930" y="436" fill="#d29922" font-size="12">缺口 6：用户打断 agent 与控制器</text>
<text x="930" y="451" fill="#d29922" font-size="12">打断 agent 是两套语义，需分别定义</text>
<text x="50" y="741" fill="#e6edf3" font-size="13" text-anchor="start">Q1 技术类 ──► 用户切到写作类 ──► 用户又切回技术类</text>
<text x="50" y="758" fill="#e6edf3" font-size="13" text-anchor="start">   │                                    │</text>
<text x="50" y="775" fill="#e6edf3" font-size="13" text-anchor="start">   技术窗口(热)                          恢复方式 = 把技术类摘要【尾部追加】</text>
<text x="50" y="792" fill="#e6edf3" font-size="13" text-anchor="start">   写作窗口(冷→热，干净窗口)              ✓ 前缀未动 → 缓存保留</text>
<text x="50" y="809" fill="#e6edf3" font-size="13" text-anchor="start">                                          ✓ 经验已 committed → 接收层第一句就能说&quot;这个我熟&quot;</text>
<rect x="60" y="840" width="830" height="33" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="70" y="861" fill="#f85149" font-size="12">缺口 10 未定义项：上下文恢复协议（用什么载体、追加到哪、旧窗口怎么回收）</text>
<rect x="940" y="50" width="420" height="862" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="954" y="72" fill="#8b949e" font-size="12" font-weight="700">链路完整性审计：8 个缺口</text>
<text x="960" y="104.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">致命（3 个）</text>
<text x="960" y="128" fill="#f85149" font-size="12" text-anchor="start">1 无角色间共享事实源：三角色对同一轮认知互不相通，用户说&quot;那个东西</text>
<text x="960" y="144" fill="#f85149" font-size="12" text-anchor="start">&quot;三个角色都在猜</text>
<text x="960" y="160" fill="#f85149" font-size="12" text-anchor="start">2 结论无法直接说出口：缺&quot;衔接改写&quot;，结论是给控制器的结构化数据，</text>
<text x="960" y="176" fill="#f85149" font-size="12" text-anchor="start">不是给人听的话</text>
<text x="960" y="192" fill="#f85149" font-size="12" text-anchor="start">3 系统注入污染会话历史：inject 的记忆简报会被记进日志，下一</text>
<text x="960" y="208" fill="#f85149" font-size="12" text-anchor="start">轮读到自己对简报的回应</text>
<text x="960" y="284.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">重要（3 个）</text>
<text x="960" y="308" fill="#d29922" font-size="12" text-anchor="start">4 两角色历史混在一条会话里，需要角色标注 + 各自读不同切片</text>
<text x="960" y="324" fill="#d29922" font-size="12" text-anchor="start">5 用户在原任务未完成时插话：未完成任务队列 + 归属轮次未定义</text>
<text x="960" y="340" fill="#d29922" font-size="12" text-anchor="start">6 用户打断 agent：与控制器打断是两套语义，未定义</text>
<text x="960" y="440.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">中等（2 个）</text>
<text x="960" y="464" fill="#8b949e" font-size="12" text-anchor="start">7 轮际状态载体：上轮说了什么/接管点/一致性，跨轮丢失</text>
<text x="960" y="480" fill="#8b949e" font-size="12" text-anchor="start">8 发言出口采集：账本只记结论，没记&quot;实际对用户说出的话&quot;，纠正的证</text>
<text x="960" y="496" fill="#8b949e" font-size="12" text-anchor="start">据链断在这里</text>
<text x="960" y="576.5" fill="#e6edf3" font-size="12.5" text-anchor="start" font-weight="700">场景覆盖度（12 个必然发生的场景）</text>
<text x="960" y="600" fill="#8b949e" font-size="12" text-anchor="start">已定义 4 个（正常轮×2、超时、取消）</text>
<text x="960" y="616" fill="#8b949e" font-size="12" text-anchor="start">只提未细化 3 个（处理层先到、续话耗尽、连续同类）</text>
<text x="960" y="632" fill="#8b949e" font-size="12" text-anchor="start">完全未定义 5 个（插话、并发提问、反馈层被打断、品类切换、多结论合</text>
<text x="960" y="648" fill="#8b949e" font-size="12" text-anchor="start">并）</text>
<rect x="960" y="700" width="380" height="118" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="970" y="721" fill="#f85149" font-size="12">规律：现有设计是&quot;单向流水线&quot;，</text>
<text x="970" y="736" fill="#f85149" font-size="12">而真实对话是&quot;有状态的并发系统&quot;。</text>
<text x="970" y="751" fill="#f85149" font-size="12">缺的 8 个里 6 个出于同一原因。</text>
<text x="970" y="766" fill="#f85149" font-size="12"></text>
<text x="970" y="781" fill="#f85149" font-size="12">根 = 缺口 1（共享事实源 + 角色视图），</text>
<text x="970" y="796" fill="#f85149" font-size="12">其余 5 个都挂在它上面。</text>
</svg></div></section>
<section id="04-memory-context"><h2>04-memory-context</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" width="1380" height="880" viewBox="0 0 1380 880" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">

  <style>text { dominant-baseline: auto; }</style>

<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 4 · 记忆层级、上下文预算与注入位置（实测依据）</text>

<text x="62" y="136" fill="#e6edf3" font-size="13">最近 8–12 轮原文 · 每品类 20–50K</text>

<rect x="50" y="200" width="560" height="92" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>

<path d="M 330 184 L 330 200" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="171" width="60" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="330" y="186" fill="#8b949e" font-size="12" text-anchor="middle">溢出压缩</text>
<path d="M 330 292 L 330 308" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="306" y="279" width="48" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="330" y="294" fill="#8b949e" font-size="12" text-anchor="middle">再压缩</text>
<rect x="50" y="402" width="560" height="33" rx="6" fill="#22201a" stroke="#3fb950" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="60" y="423" fill="#3fb950" font-size="12">上下文按品类隔离 → 成本不随总轮数增长，只随当前品类轮数增长</text>
<rect x="660" y="50" width="700" height="380" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="674" y="72" fill="#8b949e" font-size="12" font-weight="700">单次请求的组装顺序（顺序固定，不可重排）</text>

<text x="702" y="134" fill="#e6edf3" font-size="12">persona + 角色指令 + 工具说明 + 品类方法论（全静态）</text>
<rect x="690" y="174" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="194" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">历史消息</text>
<text x="702" y="216" fill="#e6edf3" font-size="12">只追加，永不改写（工具结果也放这里）</text>
<rect x="690" y="256" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="276" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">尾部注入</text>
<text x="702" y="298" fill="#e6edf3" font-size="12">记忆简报 / 上下文摘要 / 本轮要点（每轮都变）</text>
<rect x="690" y="338" width="640" height="68" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1010" y="358" fill="#3b4a5a" font-size="13" font-weight="700" text-anchor="middle">本轮用户消息</text>
<text x="702" y="380" fill="#e6edf3" font-size="12">用户原话（必须原文进，不能只给摘要）</text>
<path d="M 1010 160 L 1010 174" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1010 242 L 1010 256" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 1010 324 L 1010 338" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="450" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="472" fill="#8b949e" font-size="12" font-weight="700">实测依据：记忆植入位置决定缓存代价（长历史 4128 tokens）</text>
<text x="60" y="510" fill="#8b949e" font-size="12" text-anchor="start">植入位置                                   缓存命中        未命中量              成本</text>

<text x="64" y="524" fill="#f85149" font-size="12.5">插到最前（system 之后）</text>

<text x="720" y="524" fill="#e6edf3" font-size="12.5">未命中 3383 tokens</text>
<text x="1000" y="524" fill="#f85149" font-size="12.5">$0.001015</text>
<rect x="50" y="538" width="1280" height="30" rx="5" fill="#1a1f26"/>
<text x="64" y="558" fill="#3fb950" font-size="12.5">追加到最尾</text>
<text x="530" y="558" fill="#e6edf3" font-size="12.5">命中 95.6%</text>
<text x="720" y="558" fill="#e6edf3" font-size="12.5">未命中 184 tokens</text>

<rect x="50" y="572" width="1280" height="30" rx="5" fill="#1a1f26"/>

<text x="1000" y="592" fill="#3fb950" font-size="12.5">$0.000068</text>
<text x="60" y="656" fill="#f85149" font-size="12" text-anchor="start">结论：改前缀中部 = 未命中暴涨 18 倍。任何记忆/摘要只能尾部追加，绝不改写前缀（唯一例外：整块重建）</text>
<rect x="20" y="656" width="1340" height="196" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="678" fill="#8b949e" font-size="12" font-weight="700">双状态分路拦截：用户输入 vs 系统注入（按 source 标记判定，不靠内容猜）</text>
<rect x="60" y="700" width="600" height="130" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="360" y="721" fill="#d29922" font-size="14" font-weight="700" text-anchor="middle">状态一：用户输入触发的回应</text>
<text x="72" y="744" fill="#e6edf3" font-size="13">· 入口标记 source = 真实用户提示</text>
<text x="72" y="761" fill="#e6edf3" font-size="13">· 出口：放行 → 用户可见</text>
<text x="72" y="778" fill="#e6edf3" font-size="13">· 需要回复预算、需要进度估算</text>
<rect x="720" y="700" width="600" height="130" rx="8" fill="#302024" stroke="#f85149" stroke-width="1.5"/>
<text x="1020" y="721" fill="#f85149" font-size="14" font-weight="700" text-anchor="middle">状态二：系统注入触发的回应（记忆/上下文/简报）</text>
<text x="732" y="744" fill="#e6edf3" font-size="13">· 入口标记 source = inject 合成上下文</text>
<text x="732" y="761" fill="#e6edf3" font-size="13">· 出口：拦截，永不外发</text>
<text x="732" y="778" fill="#e6edf3" font-size="13">· 不需要回复预算，fire-and-forget，纯静默吸收</text>

<section id="05-deployment"><h2>05-deployment</h2><div class="fig"><svg xmlns="http://www.w3.org/2000/svg" width="1380" height="980" viewBox="0 0 1380 980" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC','Droid Sans Fallback','DroidSansFallbackFull',system-ui,sans-serif">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8590"/>
  </marker>
  <style>text { dominant-baseline: auto; }</style>
</defs>
<rect width="100%" height="100%" fill="#0f1419"/>
<text x="24" y="32" fill="#e6edf3" font-size="18" font-weight="700">图 5 · 客户端 + 云端部署：Flutter APP ⇄ 网关 ⇄ DSH 进程池</text>
<rect x="20" y="50" width="1340" height="210" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="72" fill="#8b949e" font-size="12" font-weight="700">一、客户端（Flutter，iOS + Android）：只负责接收与反馈，不含任何 agent 逻辑</text>
<rect x="60" y="92" width="400" height="150" rx="8" fill="#1f2d3d" stroke="#4a90d9" stroke-width="1.5"/>
<text x="260" y="113" fill="#4a90d9" font-size="14" font-weight="700" text-anchor="middle">Flutter App（Dart）</text>
<text x="72" y="136" fill="#e6edf3" font-size="13">· 聊天界面：输入框 / 消息流 / 流式打字</text>
<text x="72" y="153" fill="#e6edf3" font-size="13">· 本地持久化会话 ID 映射（三段 ID，见下）</text>
<text x="72" y="170" fill="#e6edf3" font-size="13">· WebSocket 长连接 + SSE 回退 + 断线重连</text>
<text x="72" y="187" fill="#e6edf3" font-size="13">· 消息 ID 去重与乱序重排</text>
<text x="72" y="204" fill="#e6edf3" font-size="13">· 安全存储：令牌放 Keychain / Keystore</text>
<rect x="490" y="92" width="380" height="150" rx="8" fill="#1f2d3d" stroke="#4a90d9" stroke-width="1.5"/>
<text x="680" y="113" fill="#4a90d9" font-size="14" font-weight="700" text-anchor="middle">平台差异（必须分别处理）</text>
<text x="502" y="136" fill="#e6edf3" font-size="13">· iOS：后台限制严，切后台即断连 → 服务器继续跑</text>
<text x="502" y="153" fill="#e6edf3" font-size="13">· iOS：APNs 推送；Android：FCM</text>
<text x="502" y="170" fill="#e6edf3" font-size="13">· 两者都需要&quot;回到前台拉取错过的消息&quot;</text>
<text x="502" y="187" fill="#e6edf3" font-size="13">· 应用商店审核：需账号删除入口（若有登录）</text>
<text x="502" y="204" fill="#e6edf3" font-size="13">· 弱网：地铁/电梯场景必须能续传</text>
<rect x="900" y="92" width="420" height="150" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1110" y="113" fill="#3b4a5a" font-size="14" font-weight="700" text-anchor="middle">客户端只管两件事</text>
<text x="912" y="136" fill="#e6edf3" font-size="13">① 把用户输入送上去（带会话 ID）</text>
<text x="912" y="153" fill="#e6edf3" font-size="13">② 把服务端推来的内容显示出来</text>
<text x="912" y="170" fill="#e6edf3" font-size="13"></text>
<text x="912" y="187" fill="#e6edf3" font-size="13">不做：分类、记忆、进度估算、接管判决</text>
<text x="912" y="204" fill="#e6edf3" font-size="13">—— 全部在云端，客户端保持&quot;笨&quot;</text>
<rect x="20" y="274" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="296" fill="#8b949e" font-size="12" font-weight="700">二、网关层（自建，公网唯一入口）：DSH 原生没有多用户能力，这一层不可省</text>
<rect x="60" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="158" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">鉴权 / 令牌</text>
<text x="72" y="356" fill="#e6edf3" font-size="11">登录、设备令牌、</text>
<text x="72" y="371" fill="#e6edf3" font-size="11">令牌轮换与吊销</text>
<rect x="272" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="370" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">会话 ID 三段映射</text>
<text x="284" y="356" fill="#e6edf3" font-size="11">客户端 convId →</text>
<text x="284" y="371" fill="#e6edf3" font-size="11">DSH sessionId → 角色实例</text>
<rect x="484" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="582" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">连接管理</text>
<text x="496" y="356" fill="#e6edf3" font-size="11">WebSocket 长连接池、</text>
<text x="496" y="371" fill="#e6edf3" font-size="11">心跳、断连恢复、补发</text>
<rect x="696" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="794" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">用户路由</text>
<text x="708" y="356" fill="#e6edf3" font-size="11">userId → 该用户的</text>
<text x="708" y="371" fill="#e6edf3" font-size="11">DSH 进程 socket</text>
<rect x="908" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1006" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">限额与熔断</text>
<text x="920" y="356" fill="#e6edf3" font-size="11">每用户 token 配额、</text>
<text x="920" y="371" fill="#e6edf3" font-size="11">429 退避、成本上限</text>
<rect x="1120" y="316" width="196" height="128" rx="8" fill="#1b2530" stroke="#3b4a5a" stroke-width="1.5"/>
<text x="1218" y="335" fill="#3b4a5a" font-size="12" font-weight="700" text-anchor="middle">可观测性</text>
<text x="1132" y="356" fill="#e6edf3" font-size="11">轮级 trace（含</text>
<text x="1132" y="371" fill="#e6edf3" font-size="11">缓存命中率、接管路径）</text>
<rect x="20" y="478" width="1340" height="268" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="500" fill="#8b949e" font-size="12" font-weight="700">三、云端 DSH Harness（所有 agent 都在这里）：按用户隔离的进程池</text>
<rect x="60" y="520" width="260" height="100" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="190" y="541" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">DSH 进程（用户 A）</text>
<text x="72" y="564" fill="#e6edf3" font-size="13">DSH_HOME=data/u_A</text>
<text x="72" y="581" fill="#e6edf3" font-size="13">独立凭证、独立存储</text>
<rect x="60" y="632" width="260" height="100" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="190" y="653" fill="#3fb950" font-size="14" font-weight="700" text-anchor="middle">DSH 进程（用户 B）</text>
<text x="72" y="676" fill="#e6edf3" font-size="13">DSH_HOME=data/u_B</text>
<text x="72" y="693" fill="#e6edf3" font-size="13">进程级天然隔离</text>
<rect x="360" y="520" width="620" height="212" rx="8" fill="#1a3028" stroke="#3fb950" stroke-width="1.5"/>
<text x="670" y="540" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">单个 DSH 进程内部的角色布局</text>
<text x="372" y="562" fill="#e6edf3" font-size="12">接收层 agent（快、在场）   处理层 agent × N（按类别，不扇出）   反馈层 agent（承接）</text>
<text x="372" y="578" fill="#e6edf3" font-size="12">常驻分类器（只判定）        控制器（APP 层逻辑，跑在本进程内）</text>
<text x="372" y="594" fill="#e6edf3" font-size="12">记忆库：档案 / 品类树 / 经验包 / 指标 / 证据链  ← 每用户一份</text>
<text x="372" y="610" fill="#e6edf3" font-size="12"></text>
<text x="372" y="626" fill="#e6edf3" font-size="12">进程内已有能力（已核实存在）：</text>
<text x="372" y="642" fill="#e6edf3" font-size="12">· 会话持久化 + 按 sessionId 恢复（resumeSessionId）</text>
<text x="372" y="658" fill="#e6edf3" font-size="12">· session/event 事件流、assistant/chunk（token 级）</text>
<text x="372" y="674" fill="#e6edf3" font-size="12">· agent.cancel / steer / inject / followup</text>
<text x="372" y="690" fill="#e6edf3" font-size="12">· WebSocket 下行 + SSE 流式（客户端连接的现成载体）</text>
<text x="372" y="706" fill="#e6edf3" font-size="12">· SQLite 会话查询（会话列表的来源）</text>
<rect x="1000" y="520" width="340" height="135" rx="6" fill="#22201a" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="1010" y="541" fill="#f85149" font-size="12">⚠ 已核实：DSH 没有多租户身份</text>
<text x="1010" y="556" fill="#f85149" font-size="12">· 无登录/令牌体系</text>
<text x="1010" y="571" fill="#f85149" font-size="12">· anonymous-user-id 只用于遥测</text>
<text x="1010" y="586" fill="#f85149" font-size="12">· authorization 是&quot;工具授权&quot;，不是用户鉴权</text>
<text x="1010" y="601" fill="#f85149" font-size="12">· 凭证是每 DSH_HOME 一份（本地）</text>
<text x="1010" y="616" fill="#f85149" font-size="12">· webserver 绑定仅 loopback / 全接口</text>
<text x="1010" y="631" fill="#f85149" font-size="12">→ 对外暴露必须自建网关 + 反向代理</text>
<rect x="20" y="760" width="1340" height="190" rx="10" fill="#161d26" stroke="#232c36" stroke-width="1"/>
<text x="34" y="782" fill="#8b949e" font-size="12" font-weight="700">四、数据层</text>
<rect x="60" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="210" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">会话正文</text>
<text x="72" y="842" fill="#e6edf3" font-size="12">DSH 的 session.jsonl + SQ</text>
<text x="72" y="858" fill="#e6edf3" font-size="12">Lite 索引</text>
<rect x="382" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="532" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">记忆库</text>
<text x="394" y="842" fill="#e6edf3" font-size="12">每用户一份：档案/品类树/经验/指标</text>
<rect x="704" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="854" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">凭证</text>
<text x="716" y="842" fill="#e6edf3" font-size="12">云端保管，绝不下发到客户端</text>
<rect x="1026" y="800" width="300" height="120" rx="8" fill="#2b2418" stroke="#d29922" stroke-width="1.5"/>
<text x="1176" y="820" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">配额与账单</text>
<text x="1038" y="842" fill="#e6edf3" font-size="12">每用户 token 计量、成本上限</text>

<rect x="630" y="258" width="120" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="690" y="273" fill="#8b949e" font-size="12" text-anchor="middle">③ 客户端只认网关</text>
<path d="M 690 444 L 690 520" fill="none" stroke="#7d8590" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="564" y="461" width="252" height="20" rx="4" fill="#0f1419" opacity="0.92"/>
<text x="690" y="476" fill="#8b949e" font-size="12" text-anchor="middle">④ 网关按 userId 转发到对应进程</text>
</svg></div></section>
